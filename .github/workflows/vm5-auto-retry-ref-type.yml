name: VM5 Auto Retry Ref Type

on:
  workflow_dispatch:

permissions: {}

jobs:
  fail:
    runs-on: ubuntu-latest
    steps:
      - name: Show ref identity
        run: |
          echo "ref=$GITHUB_REF"
          echo "ref_type=$GITHUB_REF_TYPE"
          echo "ref_name=$GITHUB_REF_NAME"
      - name: Controlled failure
        run: exit 1
